# =====================================================
# Profil "calc-only" — Composante 3 : Calculs SaaS
# =====================================================
# Backend Frida réduit aux endpoints /api/calculs/*.
# Aucune base de données, aucun OCR, aucune sécurité applicative.
# Les beans hors calculs sont désactivés via @Profile("!calc-only").

spring.application.name=frida-calc-only

# ----- Désactivation des auto-configurations inutiles -----
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ----- CORS (SaaS ouvert par défaut ; restreindre en prod via env) -----
spring.web.cors.allowed-origin-patterns=${CORS_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# ----- Multipart désactivé (pas d'upload en calc-only) -----
spring.servlet.multipart.enabled=false

# ----- Swagger reste utile pour tester l'API publique -----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
