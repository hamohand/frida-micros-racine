spring.application.name=backendAi
server.port=${BACKEND_PORT:8080}

# ===== MULTIPART FILE UPLOAD =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FILE_UPLOAD_MAX_SIZE:10MB}

# ===== CORS Configuration =====
spring.web.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# MySQL Configuration (DÉPRÉCIÉ - Utiliser PostgreSQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/fridaaidb?createDatabaseIfNotExist=true&useSSL=true&verifyServerCertificate=false
#spring.datasource.username=root
#spring.datasource.password=Mmk!030809?
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:-5432}/${DB_NAME:fridaocrdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Mmk!030809?}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# =====================================================
# Services Configuration
# =====================================================

services.ocr.url=${SERVICES_OCR_URL:http://localhost:8082}
services.ocr.mode=${SERVICES_OCR_MODE:rapide}

# =====================================================
# Sauvegarde & Archivage
# =====================================================
# Une sauvegarde = dossier <nom>/database.sql + <nom>/uploads, le format de sauvegarder.bat.
# Dossier des sauvegardes (défaut = ROOT_PATH/backups). Installation notaire : /app/backups = data\backups
app.backup.path=${BACKUP_PATH:}
# Sauvegarde automatique si la dernière a plus de auto-interval-hours,
# vérifiée auto-initial-delay-ms après le démarrage puis toutes les auto-check-interval-ms
app.backup.auto-enabled=${BACKUP_AUTO_ENABLED:false}
app.backup.auto-interval-hours=${BACKUP_AUTO_INTERVAL_HOURS:24}
app.backup.auto-initial-delay-ms=${BACKUP_AUTO_INITIAL_DELAY_MS:120000}
app.backup.auto-check-interval-ms=${BACKUP_AUTO_CHECK_INTERVAL_MS:3600000}
# Sauvegardes automatiques conservées (les manuelles ne sont jamais supprimées)
app.backup.auto-keep=${BACKUP_AUTO_KEEP:7}
# Démo publique : sauvegardes et archives consultables mais ni créées, ni restaurées,
# ni supprimées, ni téléchargées
app.sauvegardes.lecture-seule=${SAUVEGARDES_LECTURE_SEULE:false}
# Seuil d'archivage en mois (dossiers plus vieux que X mois)
app.archive.threshold-months=${ARCHIVE_THRESHOLD_MONTHS:6}
# Chemin des archives (optionnel, défaut = ROOT_PATH/archives)
app.archive.path=${ARCHIVE_PATH:}
# Archivage automatique mensuel : retire de la base active les dossiers anciens.
# Désactivé par défaut, indépendant de la sauvegarde automatique.
app.archive.auto-enabled=${ARCHIVE_AUTO_ENABLED:false}
app.archive.cron=${ARCHIVE_CRON:0 0 3 1 * *}

# =====================================================
# Sécurité
# =====================================================
# Mode démo : toute requête sans jeton est authentifiée en Maître. Désactivé par défaut,
# activé explicitement (APP_DEMO_MODE=true) par la démo en ligne et le poste de développement.
app.demo-mode=${APP_DEMO_MODE:false}

# Compte applicatif initial cree au premier demarrage (DataInitializer).
# ADMIN_PASSWORD vide => un mot de passe aleatoire est genere et journalise.
# Aucun mot de passe par defaut n'est code en dur.
app.admin.username=${ADMIN_USERNAME:maitre}
app.admin.password=${ADMIN_PASSWORD:}
