<div class="mobile-scanner-container">
  <div class="header">
    <h1><span class="icon">📷</span> Frida Scanner</h1>
    <p><app-bilabel fr="Scan compagnon pour poste fixe" ar="مرافق المسح للحاسوب المكتبي" /></p>
  </div>

  <div class="content" *ngIf="status === 'idle' || status === 'error'">
    <div class="instruction">
      Prenez en photo le <b>recto</b> de la pièce d'identité pour extraire la date de délivrance et déverrouiller la puce.
    </div>

    <label class="scan-btn">
      <span><app-bilabel fr="Prendre la photo" ar="التقاط الصورة" /></span>
      <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event)" />
    </label>

    <div class="error" *ngIf="status === 'error'">
      ⚠️ {{ errorMessage }}
    </div>
  </div>

  <div class="content loading" *ngIf="status === 'uploading'">
    <div class="spinner"></div>
    <p><app-bilabel fr="Analyse de la carte en cours..." ar="جارٍ تحليل البطاقة..." /></p>
    <small><app-bilabel fr="Veuillez patienter." ar="يرجى الانتظار." /></small>
  </div>

  <div class="content success" *ngIf="status === 'success'">
    <div class="check-icon">✅</div>
    <h2><app-bilabel fr="Succès !" ar="نجاح!" /></h2>
    <p><app-bilabel fr="La carte a été analysée avec succès." ar="تم تحليل البطاقة بنجاح." /></p>
    <p><app-bilabel fr="Vous pouvez retourner sur votre ordinateur, la lecture va se lancer automatiquement." ar="يمكنك العودة إلى حاسوبك، ستنطلق القراءة تلقائياً." /></p>
  </div>
</div>
