<div class="license-container">
  <div class="license-card">
    <div class="header">
      <h2>🛡️ <app-bilabel fr="Activation de Frida" ar="تفعيل فريدا" /></h2>
      <p><app-bilabel fr="Une licence valide est requise pour utiliser cette installation de Frida." ar="مطلوب ترخيص صالح لاستخدام هذا التثبيت من فريدا." /></p>
    </div>

    <div *ngIf="isLoading" class="loading">
      Vérification en cours...
    </div>

    <div *ngIf="!isLoading">
      <div class="status-box" [ngClass]="isValid ? 'status-valid' : 'status-invalid'">
        <div class="status-icon">
          <span *ngIf="isValid">✅</span>
          <span *ngIf="!isValid">⚠️</span>
        </div>
        <div class="status-text">
          <strong>{{ isValid ? 'Licence Active' : 'Licence Requise ou Expirée' }}</strong>
          <span class="hw-id">Identifiant Machine : {{ hardwareId }}</span>
        </div>
      </div>

      <div class="form-group" *ngIf="!isValid">
        <label><app-bilabel fr="Saisissez votre clé de licence" ar="أدخل مفتاح الترخيص" /></label>
        <input type="text" [(ngModel)]="licenseKey" placeholder="FRIDA-XXXX-YYYY" class="form-control" />
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      
      <div class="alert alert-success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button class="btn btn-primary" (click)="activate()" *ngIf="!isValid" [disabled]="!licenseKey || isLoading">
        <app-bilabel fr="Activer ma licence" ar="تفعيل الترخيص" />
      </button>

      <button class="btn btn-outline" routerLink="/" *ngIf="isValid">
        <app-bilabel fr="Accéder à l'application" ar="الدخول إلى التطبيق" />
      </button>
    </div>
  </div>
</div>
