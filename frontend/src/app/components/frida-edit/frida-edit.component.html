<div class="edit-container" *ngIf="!loading && frida">
  <div class="header">
    <button class="back-btn" (click)="annuler()">← Retour</button>
    <h2>Correction OCR : Dossier {{ frida.numFrida }}</h2>
    <span class="badge-alert">⚠️ Fiabilité < 65% détectée</span>
  </div>

  <div class="alert alert-warning" *ngIf="errorMsg">
    {{ errorMsg }}
  </div>

  <div class="content-body">
    <p class="subtitle"><app-bilabel fr="Veuillez vérifier et corriger les champs extraits pour garantir le calcul correct des parts." ar="يرجى التحقق من الحقول المستخرجة وتصحيحها لضمان صحة الحساب." /></p>

    <!-- SECTION DÉFUNT -->
    <div class="card" *ngIf="frida.defunt">
      <h3><app-bilabel fr="Informations du Défunt" ar="معلومات المتوفى" /></h3>
      <div class="form-grid">
        <div class="form-group">
          <label><app-bilabel fr="Nom" ar="اللقب" /></label>
          <input type="text" [(ngModel)]="frida.defunt.identite.nom" class="form-control" />
        </div>
        <div class="form-group">
          <label><app-bilabel fr="Prénom" ar="الاسم" /></label>
          <input type="text" [(ngModel)]="frida.defunt.identite.prenom" class="form-control" />
        </div>
        <div class="form-group">
          <label><app-bilabel fr="Sexe" ar="الجنس" /> <span class="calc-impact" title="Impacte le calcul !">🧮</span></label>
          <select [(ngModel)]="frida.defunt.identite.sexe" class="form-control">
            <option value="ذكر">ذكر (Masculin)</option>
            <option value="أنثى">أنثى (Féminin)</option>
          </select>
        </div>
        <div class="form-group">
          <label><app-bilabel fr="Date de Naissance" ar="تاريخ الميلاد" /></label>
          <input type="date" [(ngModel)]="frida.defunt.identite.dateNaissance" class="form-control" />
        </div>
      </div>
    </div>

    <!-- SECTION HÉRITIERS -->
    <div class="card" *ngIf="frida.heritiers && frida.heritiers.length > 0">
      <h3><app-bilabel fr="Héritiers Reconnus" ar="الورثة المعترف بهم" /> ({{ frida.heritiers.length }})</h3>

      <div class="heir-item" *ngFor="let heritier of frida.heritiers; let i = index">
        <h4>{{ i + 1 }}. <app-bilabel fr="Héritier (Parenté :" ar="الوارث (صلة القرابة :" /> {{ heritier.numParente }})</h4>
        <div class="form-grid">
          <div class="form-group">
            <label><app-bilabel fr="Nom" ar="اللقب" /></label>
            <input type="text" [(ngModel)]="heritier.identite.nom" class="form-control" />
          </div>
          <div class="form-group">
            <label><app-bilabel fr="Prénom" ar="الاسم" /></label>
            <input type="text" [(ngModel)]="heritier.identite.prenom" class="form-control" />
          </div>
          <div class="form-group">
            <label><app-bilabel fr="Sexe" ar="الجنس" /> <span class="calc-impact" title="Impacte le calcul !">🧮</span></label>
            <select [(ngModel)]="heritier.identite.sexe" class="form-control">
              <option value="ذكر">ذكر (Masculin)</option>
              <option value="أنثى">أنثى (Féminin)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="actions-footer">
    <button class="btn btn-secondary" (click)="annuler()" [disabled]="saving"><app-bilabel fr="Annuler" ar="إلغاء" /></button>
    <button class="btn btn-primary" (click)="sauvegarderCorrections()" [disabled]="saving">
      <span *ngIf="saving"><app-bilabel fr="Recalcul en cours..." ar="جارٍ إعادة الحساب..." /></span>
      <span *ngIf="!saving"><app-bilabel fr="Valider et relancer le calcul" ar="تأكيد وإعادة تشغيل الحساب" /></span>
    </button>
  </div>
</div>

<div class="loading-state" *ngIf="loading">
  <div class="spinner"></div>
  <p><app-bilabel fr="Chargement du dossier..." ar="جارٍ تحميل الملف..." /></p>
</div>
